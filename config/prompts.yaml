    ```

    ## Reglas finales

    - documento_revisado SIEMPRE respeta el schema de fase 1 (mismos
      campos y tipos). contexto_linea es un bloque valido del schema.
    - Todas las lineas del mismo suministro (base + exceso) comparten el
      MISMO codigo_imputacion.
    - No inventes campos fuera del schema. Ante duda seria en un campo que
      no sea de mortero, deja el de fase 1.

  schema_hint: >
    Devuelve SOLO JSON valido con: review_status, explicacion_global,
